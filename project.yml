name: OwnAudioBooks
options:
  bundleIdPrefix: audio.own
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  BookLibrary:
    path: Packages/BookLibrary
  PlayerEngine:
    path: Packages/PlayerEngine
targets:
  OwnAudioBooks:
    type: application
    platform: iOS
    sources:
      - path: App/OwnAudioBooks
      - path: Shared
    info:
      path: App/OwnAudioBooks/Info.plist
      properties:
        CFBundleDisplayName: own.book
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [audio.own.bookplayer.refresh]
        NSSupportsLiveActivities: true
        # Only standard HTTPS, which is exempt; saves answering the export question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        # The widget's and Siri's way in: ownbook://play/<book id>.
        CFBundleURLTypes:
          - CFBundleURLName: audio.own.bookplayer
            CFBundleURLSchemes: [ownbook]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home servers are usually plain http on the LAN or a Tailscale address; the server URL
        # is whatever the user types, so ATS can't be scoped to known domains.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connects to the audiobook server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.bookplayer
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: this repo is public. Simulator builds don't need one; for a
        # device, pick your team in Xcode (it is not saved into project.yml).
    entitlements:
      path: App/OwnAudioBooks/OwnAudioBooks.entitlements
      properties:
        # Sign in with Apple for own.audio servers (AUTH__APPLE__CLIENT_IDS must list this app).
        com.apple.developer.applesignin: [Default]
        # CarPlay audio app (granted by Apple for audio.own.bookplayer, 2026-10-16).
        com.apple.developer.carplay-audio: true
        # Shared with the widget: the Continue Listening snapshot.
        com.apple.security.application-groups: [group.audio.own.bookplayer]
    dependencies:
      - target: OwnAudioBooksWidgets
      - package: BookLibrary
      - package: PlayerEngine
        product: PlayerCore
      - package: PlayerEngine
        product: SpokenEngine
  OwnAudioBooksWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: own.book
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.bookplayer.widgets
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Widgets/OwnAudioBooksWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.audio.own.bookplayer]
  # Unit tests of the app's own code (what CarPlay shows), hosted by the app.
  OwnAudioBooksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OwnAudioBooks.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OwnAudioBooks
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioBooks
  OwnAudioBooksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAudioBooks
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioBooks
schemes:
  OwnAudioBooks:
    build:
      targets:
        OwnAudioBooks: all
        OwnAudioBooksTests: [test]
        OwnAudioBooksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OwnAudioBooksTests
        - OwnAudioBooksUITests
    archive:
      config: Release
