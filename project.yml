name: OwnAudioBooks
options:
  bundleIdPrefix: audio.own
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  OwnAudioKit:
    path: Packages/OwnAudioKit
  ServerSupport:
    path: Packages/ServerSupport
  PlayerEngine:
    path: Packages/PlayerEngine
targets:
  OwnAudioBooks:
    type: application
    platform: iOS
    sources:
      - path: App/OwnAudioBooks
    info:
      path: App/OwnAudioBooks/Info.plist
      properties:
        CFBundleDisplayName: own.book
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Only standard HTTPS, which is exempt; saves answering the export question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home servers are usually plain http on the LAN or a Tailscale address; the server URL
        # is whatever the user types, so ATS can't be scoped to known domains.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connects to the audiobook server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.bookplayer
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: this repo is public. Simulator builds don't need one; for a
        # device, pick your team in Xcode (it is not saved into project.yml).
    entitlements:
      path: App/OwnAudioBooks/OwnAudioBooks.entitlements
      properties:
        # Sign in with Apple for own.audio servers (AUTH__APPLE__CLIENT_IDS must list this app).
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: OwnAudioKit
      - package: ServerSupport
      - package: PlayerEngine
        product: PlayerCore
  OwnAudioBooksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAudioBooks
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioBooks
schemes:
  OwnAudioBooks:
    build:
      targets:
        OwnAudioBooks: all
        OwnAudioBooksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OwnAudioBooksUITests
    archive:
      config: Release
